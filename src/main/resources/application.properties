spring.application.name=financeapp
# Servidor
server.port=8080

# Banco de dados
spring.datasource.url=jdbc:postgresql://localhost:5432/financeapp
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.financeapp.api.controller
springdoc.override-with-generic-response=false

# Actuator
management.endpoints.web.exposure.include=health,info

# JWT
jwt.secret=3f8a2b1c9d4e7f0a6b5c2d8e1f3a7b4c9d2e5f0a8b3c6d1e4f7a0b5c8d2e6f1a
jwt.expiration=86400000